<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menciones Mini Evento • TETR.IO</title>
  <meta name="description" content="Chat del mini evento de TETR.IO renderizado con el estilo de Discord.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <main class="chat">
      <header class="chat-header">
        <span class="hash" aria-hidden="true">#</span>
        <h1 class="channel-name" id="channel-name">Cargando…</h1>
      </header>

      <div class="messages" id="messages"></div>
    </main>

    <aside class="featured" id="featured" aria-label="Mensaje fijo"></aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
